[[accept]]
id = "tagged-secrets"
edits = [{ file = ".github/workflows/build.yml", find = '    secrets:\n      TOKEN:', replace = '    secrets: !t\n      TOKEN:' }]

[[accept]]
id = "tagged-runs"
edits = [{ file = ".github/actions/setup/action.yml", find = 'runs:\n', replace = 'runs: !t\n' }]

[[accept]]
id = "tagged-action-steps"
edits = [{ file = ".github/actions/setup/action.yml", find = '  steps:\n', replace = '  steps: !t\n' }]

[[accept]]
id = "tagged-step"
edits = [{ file = ".github/actions/setup/action.yml", find = '    - name: Install the toolchain', replace = '    - !t\n      name: Install the toolchain' }]

[[accept]]
id = "tagged-root"
edits = [{ file = ".github/workflows/notify.yaml", find = 'name: Notify', replace = '!t\nname: Notify' }]

[[accept]]
id = "tagged-root-on-the-marker"
edits = [{ file = ".github/workflows/notify.yaml", find = 'name: Notify', replace = '--- !t\nname: Notify' }]

[[accept]]
id = "comment-on-the-marker"
edits = [{ file = ".github/workflows/notify.yaml", find = 'name: Notify', replace = '--- # the notifier\nname: Notify' }]

[[accept]]
id = "merge-key"
edits = [{ file = ".github/workflows/notify.yaml", find = 'jobs:\n  say:\n    runs-on: ubuntu-latest', replace = 'x: &base\n  runs-on: ubuntu-latest\njobs:\n  say:\n    <<: *base' }]

[[case]]
id = "tagged-needs"
rust = 'unsupported job needs value: TaggedValue'
code = "FORGE-E052"
edits = [{ file = ".github/workflows/build.yml", find = 'needs: test', replace = 'needs: !t test' }]

[[case]]
id = "tagged-needs-list"
rust = 'unsupported job needs value: TaggedValue'
code = "FORGE-E052"
edits = [{ file = ".github/workflows/build.yml", find = 'needs: test', replace = 'needs: !t [test]' }]

[[case]]
id = "float-in-needs"
rust = 'needs must contain job names'
code = "FORGE-E052"
edits = [{ file = ".github/workflows/build.yml", find = 'needs: test', replace = 'needs: [test, 1.0]' }]
