# Trees the Rust war room accepts, which the forge must accept too. A `divergence` here is a tree
# the Rust refused and the forge accepts, with the reason it can't or shouldn't refuse it.

[[accept]]
id = "reusable-action"
edits = [
  { file = ".github/actions/setup/action.yml", find = 'name: Setup\n', replace = 'name: Setup\non:\n  workflow_call:\n' },
  { file = "war-room/ecosystem.toml", find = 'stroggforge = ["build"]', replace = 'stroggforge = ["build", "setup"]' },
]

[[accept]]
id = "null-contract"
edits = [{ file = ".github/workflows/build.yml", find = '    secrets:\n      TOKEN:\n        required: false\n', replace = '    secrets: ~\n' }]

[[accept]]
