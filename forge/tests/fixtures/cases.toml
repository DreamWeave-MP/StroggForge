# The negative corpus: each case copies fixtures/repo, makes its edits, and must fail `check` with
# `code`. Each edit replaces text that occurs exactly once in its file, or deletes the file. The
# edits are TOML literal strings, so the two characters \n in `find` and `replace` stand for a line
# break; nothing else is escaped.
#
# The Rust war room's verdict on the same tree is recorded in oracle.json by tests/oracle.jsl. A
# case agrees with it unless it names a `divergence`: why the forge decides differently, on purpose.

[[case]]
id = "unknown-field"
code = "FORGE-E010"
edits = [{ file = "war-room/ecosystem.toml", find = 'scope = "Fixture."', replace = 'scope = "Fixture."\ncolour = "red"' }]

