name: "Mod Template setup"
description: "What ./buildSite needs: Python with the template's requirements, and the Zola version the site pins."

inputs:
  python-version:
    description: "Python version."
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: tools/requirements.txt

    - name: Install the template's Python requirements
      shell: bash
      run: python -m pip install -r tools/requirements.txt

    - name: Read the Zola version the site pins
      id: zola
      shell: bash
      run: echo "version=$(./buildSite zola-version)" >> "$GITHUB_OUTPUT"

    - uses: taiki-e/install-action@v2
      with:
        tool: zola@${{ steps.zola.outputs.version }}
