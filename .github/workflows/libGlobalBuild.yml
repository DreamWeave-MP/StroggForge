name: Library CI

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      DW_BOT_PAT:
        required: false
      DISCORD_CHANNEL_WEBHOOK:
        required: false
      DW_TOOLS_CHANNEL_WEBHOOK:
        required: false
    inputs:
      crate_names:
        type: string
        description: "JSON array of crate names to publish, e.g. '[\"my-lib\"]'. Must match [package].name in Cargo.toml."
        required: true

      dependent_repo_names:
        type: string
        description: "Dependent repositories to notify on tagged releases, one owner/repo per line. JSON arrays are still accepted for compatibility."
        required: false
        default: ''

      publish_docs:
        type: boolean
        required: false
        default: true
        description: "Build cargo doc and deploy to GitHub Pages. Disable if the project uses its own SSG."

      cargo_publish:
        type: boolean
        required: false
        default: true
        description: "Publish to crates.io on tagged releases; run a dry-run on all other pushes. Requires CARGO_REGISTRY_TOKEN secret."

      cargo_publish_workspace:
        type: boolean
        required: false
        default: false
        description: "Publish every publishable workspace member in dependency order instead of one crate per crate name. Skips versions already on crates.io and waits out crates.io rate limits."

      msrv:
        type: string
        required: false
        default: ''
        description: "Minimum supported Rust version to check the workspace against before release, e.g. '1.88'. 'auto' reads rust-version from Cargo.toml. Empty skips the check."

      generate_changelog:
        type: boolean
        required: false
        default: true
        description: "Generate a CHANGELOG.md from git history and upload it to the release."

      generate_benchmarks:
        type: boolean
        required: false
        default: false
        description: "Run cargo bench, generate BENCHMARKS.md from Criterion output or the raw benchmark log, and upload it to the release."

      generate_discord_notification:
        type: boolean
        required: false
        default: true
        description: "Generate a discord notification to DreamWeave upon success."

      mod_template:
        type: boolean
        required: false
        default: false
        description: "The repository is a DreamWeave Mod Template site. modGlobalBuild records each version crates.io has in mod.lock, after a tag's publish, and builds and deploys the site. Replaces rustdoc Pages; the caller also grants actions: write."

concurrency:
  group: stroggforge-lib-global-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ensure any previously-existing release is deleted,
  # then create a fresh release with GitHub-generated notes and workflow ID.
  release_cleanup:
    if: github.event_name != 'pull_request'
    needs: [test, clippy, fmt, audit, msrv]
    uses: DreamWeave-MP/StroggForge/.github/workflows/createRelease.yml@v48
    secrets: inherit

  # Run the full test suite on all platforms. Blocks release.
  test:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-22.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        id: rust_toolchain
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
      - name: Cache Cargo target directory
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-
      - name: Run Tests
        run: cargo test --workspace --all-targets --all-features -- --show-output

  # Check formatting. Blocks release.
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Formatting
        run: cargo fmt --all --check

  # Run Clippy at pedantic level. Blocks release.
  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        id: rust_toolchain
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
      - name: Cache Cargo target directory
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -W clippy::pedantic -D warnings

  # Scan Cargo.lock against the RustSec advisory database. Blocks release.
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - uses: taiki-e/install-action@cargo-audit
      - name: Run Cargo audit
        run: cargo audit
        working-directory: ${{ github.workspace }}

  # Check the workspace on its minimum supported Rust version. Blocks release.
  # Always runs so release jobs can depend on it; with no msrv input it only logs a skip.
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - name: Skip MSRV Check
        if: inputs.msrv == ''
        run: echo "msrv input is empty; skipping the MSRV check."
      - uses: actions/checkout@v6
        if: inputs.msrv != ''
        with:
          submodules: true
      - uses: actions/checkout@v6
        if: inputs.msrv != ''
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v48
          path: .stroggforge
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.msrv != ''
      - name: Resolve MSRV
        if: inputs.msrv != ''
        id: msrv
        env:
          MSRV_INPUT: ${{ inputs.msrv }}
        run: bash .stroggforge/scripts/shared/resolve-msrv.sh "$MSRV_INPUT"
      - uses: dtolnay/rust-toolchain@master
        if: inputs.msrv != ''
        id: rust_toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
        if: inputs.msrv != ''
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}
      - name: Cache Cargo registry
        if: inputs.msrv != ''
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-msrv-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-msrv-
      - name: Cache Cargo target directory
        if: inputs.msrv != ''
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
      - name: Check on MSRV
        if: inputs.msrv != ''
        env:
          # Without a Cargo.lock, resolve dependency versions that still build on the MSRV.
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
          MSRV_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: cargo "+$MSRV_TOOLCHAIN" check --workspace --all-features --all-targets

  # Verify each crate would be publishable to crates.io. Informational — does not block release.
  cargo-publish-dry-run:
    if: inputs.cargo_publish && !inputs.cargo_publish_workspace && github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        crate_names: ${{ fromJson(inputs.crate_names) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v48
          path: .stroggforge
      - uses: dtolnay/rust-toolchain@stable
        id: rust_toolchain
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
      - name: Cache Cargo target directory
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-
      - name: Publish Dry Run
        run: |
          MANIFEST=$(bash .stroggforge/scripts/shared/resolve-crate-manifest.sh "${{ matrix.crate_names }}")
          rm -rf .stroggforge
          cargo publish --dry-run --manifest-path "$MANIFEST"

  # Publish each crate to crates.io on tagged releases, after all quality gates pass.
  cargo-publish:
    if: inputs.cargo_publish && !inputs.cargo_publish_workspace && github.ref_type == 'tag'
    needs: [test, clippy, fmt, audit, msrv]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        crate_names: ${{ fromJson(inputs.crate_names) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v48
          path: .stroggforge
      - uses: dtolnay/rust-toolchain@stable
        id: rust_toolchain
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
      - name: Cache Cargo target directory
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          MANIFEST=$(bash .stroggforge/scripts/shared/resolve-crate-manifest.sh "${{ matrix.crate_names }}")
          rm -rf .stroggforge
          cargo publish --manifest-path "$MANIFEST"

  # Package and verify every publishable workspace member against the others. Informational — does not block release.
  cargo-publish-workspace-dry-run:
    if: inputs.cargo_publish && inputs.cargo_publish_workspace && github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        id: rust_toolchain
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
      - name: Cache Cargo target directory
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-
      - name: Publish Dry Run
        run: cargo publish --workspace --dry-run

  # Publish every publishable workspace member, dependencies first, on tagged releases, after all quality gates pass.
  # Rerunning is safe: versions already on crates.io are skipped, and crates.io's new-crate rate limit is waited out.
  cargo-publish-workspace:
    if: inputs.cargo_publish && inputs.cargo_publish_workspace && github.ref_type == 'tag'
    needs: [test, clippy, fmt, audit, msrv]
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    concurrency:
      group: stroggforge-crates-io-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v48
          path: .stroggforge
      - uses: dtolnay/rust-toolchain@stable
        id: rust_toolchain
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
      - name: Cache Cargo target directory
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-
      - name: Publish Workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cp .stroggforge/.github/scripts/publish_workspace.py "$RUNNER_TEMP/publish_workspace.py"
          rm -rf .stroggforge
          python3 "$RUNNER_TEMP/publish_workspace.py"

  # Build cargo doc and deploy to GitHub Pages.
  # Requires Pages to be enabled with "GitHub Actions" as the source in repo settings.
  docs:
    if: inputs.publish_docs && !inputs.mod_template && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, clippy, fmt, audit, msrv]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v48
          path: .stroggforge
      - uses: dtolnay/rust-toolchain@stable
        id: rust_toolchain
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
      - name: Cache Cargo target directory
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-
      - name: Remove stale documentation output
        run: rm -rf target/doc
      - name: Build Documentation
        run: cargo doc --no-deps --workspace
      - name: Create Index Redirect
        run: bash .stroggforge/scripts/shared/docs-index.sh '${{ inputs.crate_names }}' target/doc/index.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/doc
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  # Generate a CHANGELOG.md from git history and upload it to the release.
  changelog:
    if: inputs.generate_changelog && github.event_name != 'pull_request'
    needs: [release_cleanup]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v48
          path: .stroggforge
      - name: Generate Changelog
        run: bash .stroggforge/scripts/shared/changelog.sh CHANGELOG.md
      - name: Upload Changelog to Release
        uses: softprops/action-gh-release@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.release_cleanup.outputs.release_name }}
          files: CHANGELOG.md

  # Run cargo bench, generate BENCHMARKS.md from Criterion output or the raw benchmark log, and upload to the release.
  benchmarks:
    if: inputs.generate_benchmarks && github.event_name != 'pull_request'
    needs: [release_cleanup]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v48
          path: .stroggforge
      - uses: dtolnay/rust-toolchain@stable
        id: rust_toolchain
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v48
      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
      - name: Cache Cargo target directory
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-${{ (hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml')) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-${{ steps.rust_toolchain.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-target-
      - name: Remove stale benchmark output
        run: rm -rf target/criterion benchmark-output.txt BENCHMARKS.md
      - name: Generate Benchmark Docs
        run: bash .stroggforge/scripts/shared/generate-benchmark-docs.sh .stroggforge/.github/scripts/gen_benchmarks.py
      - name: Upload Benchmark Docs to Release
        uses: softprops/action-gh-release@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.release_cleanup.outputs.release_name }}
          files: BENCHMARKS.md

  # One notification per run, after every release and publish job has finished, so it can report any failure.
  # Superseded (cancelled) runs stay quiet; the run that replaced them reports instead.
  # The DreamWeave Mod Template stage: record crate versions from crates.io, after a tag's publish,
  # then build and deploy the site. Pull requests build the site without recording or deploying.
  mod-template:
    if: always() && !cancelled() && inputs.mod_template && (github.event_name == 'pull_request' || needs.release_cleanup.result == 'success') && (github.ref_type != 'tag' || !inputs.cargo_publish || needs.cargo-publish.result == 'success' || needs.cargo-publish-workspace.result == 'success')
    needs: [release_cleanup, cargo-publish, cargo-publish-workspace]
    permissions:
      actions: write
      contents: write
      id-token: write
      pages: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/modGlobalBuild.yml@v48
    secrets: inherit
    with:
      rust_release: true

  call-discord-webhook:
    if: always() && !cancelled() && inputs.generate_discord_notification && github.event_name == 'push'
    needs: [test, fmt, clippy, audit, msrv, release_cleanup, docs, changelog, benchmarks, cargo-publish, cargo-publish-workspace, mod-template]
    uses: DreamWeave-MP/StroggForge/.github/workflows/discord.yml@v48
    secrets:
      WEBHOOK_URL: ${{ secrets.DISCORD_CHANNEL_WEBHOOK || secrets.DW_TOOLS_CHANNEL_WEBHOOK }}
    with:
      title: ${{ (contains(needs.*.result, 'failure') || (inputs.generate_changelog && needs.changelog.result != 'success')) && format('{0} pipeline failed! 😭', github.event.repository.name) || '' }}
      description: ${{ (contains(needs.*.result, 'failure') || (inputs.generate_changelog && needs.changelog.result != 'success')) && format('[Workflow Results](https://github.com/{0}/actions/runs/{1})', github.repository, github.run_id) || format('[{0}](https://github.com/{1}/releases/tag/{0}) is now available on {2}.', github.ref_type == 'tag' && github.ref_name || 'development', github.repository, ((github.ref_type == 'tag' && (needs['cargo-publish'].result == 'success' || needs['cargo-publish-workspace'].result == 'success')) && 'GitHub and crates.io') || 'GitHub') }}

  # For any repositories which use this one as a dependent,
  # notify them by creating an issue within the DreamWeave org's scope.
  nag-dependents:
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && inputs.dependent_repo_names != '' && inputs.dependent_repo_names != '[]'
    needs: [release_cleanup]

    uses: DreamWeave-MP/StroggForge/.github/workflows/dependent.yml@v48

    secrets:
      DW_BOT_PAT: ${{ secrets.DW_BOT_PAT }}
    with:
      aur_package_name: ''
      dependent_repo_names: ${{ inputs.dependent_repo_names }}
