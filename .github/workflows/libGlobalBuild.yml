name: Library CI

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      DW_BOT_PAT:
        required: false
      DISCORD_CHANNEL_WEBHOOK:
        required: false
      DW_TOOLS_CHANNEL_WEBHOOK:
        required: false
    inputs:
      crate_names:
        type: string
        description: "JSON array of crate names to publish, e.g. '[\"my-lib\"]'. Must match [package].name in Cargo.toml."
        required: true

      dependent_repo_names:
        type: string
        description: "Dependent repositories to notify on tagged releases, one owner/repo per line. JSON arrays are still accepted for compatibility."
        required: false
        default: ''

      publish_docs:
        type: boolean
        required: false
        default: true
        description: "Build cargo doc and deploy to GitHub Pages. Disable if the project uses its own SSG."

      cargo_publish:
        type: boolean
        required: false
        default: true
        description: "Publish to crates.io on tagged releases; run a dry-run on all other pushes. Requires CARGO_REGISTRY_TOKEN secret."

      cargo_publish_workspace:
        type: boolean
        required: false
        default: false
        description: "Publish every publishable workspace member in dependency order instead of one crate per crate name. Skips versions already on crates.io and waits out crates.io rate limits."

      msrv:
        type: string
        required: false
        default: ''
        description: "Minimum supported Rust version to check the workspace against before release, e.g. '1.88'. 'auto' reads rust-version from Cargo.toml. Empty skips the check."

      generate_changelog:
        type: boolean
        required: false
        default: true
        description: "Generate a CHANGELOG.md from git history and upload it to the release."

      generate_benchmarks:
        type: boolean
        required: false
        default: false
        description: "Run cargo bench, generate BENCHMARKS.md from Criterion output or the raw benchmark log, and upload it to the release."

      generate_discord_notification:
        type: boolean
        required: false
        default: true
        description: "Generate a discord notification to DreamWeave upon success."

      mod_template:
        type: boolean
        required: false
        default: false
        description: "The repository is a DreamWeave Mod Template site. modGlobalBuild records each version crates.io has in mod.lock, after a tag's publish, and builds and deploys the site. Replaces rustdoc Pages; the caller also grants actions: write."

concurrency:
  group: stroggforge-lib-global-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not depend on the platform, in one job: formatting, the RustSec audit,
  # the minimum supported Rust version, and whether each crate would package for crates.io.
  lint:
    name: Format, audit, MSRV and packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v52
          path: .stroggforge

      - uses: DreamWeave-MP/StroggForge/.github/actions/rust-setup@v52
        with:
          components: rustfmt
          llvm: ${{ inputs.cargo_publish && github.ref_type != 'tag' }}
          cache: lint

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Generate Cargo.lock for the audit
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies against RustSec
        run: cargo audit

      # Informational: a crate that would not package does not hold back a development build.
      - name: Package each crate for crates.io (dry run)
        if: inputs.cargo_publish && github.ref_type != 'tag'
        continue-on-error: true
        env:
          CRATE_NAMES: ${{ inputs.crate_names }}
          PUBLISH_WORKSPACE: ${{ inputs.cargo_publish_workspace }}
        run: |
          if [ "$PUBLISH_WORKSPACE" = true ]; then
            cargo publish --workspace --dry-run
            exit 0
          fi
          for crate in $(jq -r '.[]' <<<"$CRATE_NAMES"); do
            manifest=$(bash .stroggforge/scripts/shared/resolve-crate-manifest.sh "$crate")
            cargo publish --dry-run --manifest-path "$manifest"
          done

      - name: Resolve the MSRV
        if: inputs.msrv != ''
        id: msrv
        env:
          MSRV_INPUT: ${{ inputs.msrv }}
        run: bash .stroggforge/scripts/shared/resolve-msrv.sh "$MSRV_INPUT"

      - uses: DreamWeave-MP/StroggForge/.github/actions/rust-setup@v52
        if: inputs.msrv != ''
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}
          cache: msrv
          target-dir: target/msrv

      - name: Check on the MSRV
        if: inputs.msrv != ''
        env:
          # Without a Cargo.lock, resolve dependency versions that still build on the MSRV.
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
          CARGO_TARGET_DIR: target/msrv
          MSRV_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: cargo "+$MSRV_TOOLCHAIN" check --workspace --all-features --all-targets

  # Every desktop platform lints and tests, not only Linux: code behind cfg(windows) or
  # cfg(target_os = "macos") is only compiled, and so only checked, where it builds. Each job
  # lints twice: with every feature, and with the default features a dependent gets.
  test:
    name: Test and lint on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-22.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DreamWeave-MP/StroggForge/.github/actions/rust-setup@v52
        with:
          components: clippy
          cache: test

      - name: Clippy with every feature
        run: cargo clippy --workspace --all-targets --all-features -- -W clippy::pedantic -D warnings

      - name: Clippy with the default features
        run: cargo clippy --workspace -- -W clippy::pedantic -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features -- --show-output

  # The GitHub release (the development release, or the tag's), the changelog, and on tags an
  # issue in each dependent repository, in one job once everything passed.
  publish:
    name: Publish the release
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_name: ${{ steps.release.outputs.release_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v52
          path: .stroggforge

      - name: Refresh the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'development' }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          bash .stroggforge/scripts/shared/refresh-github-release.sh "$RELEASE_NAME" "$WORKFLOW_RUN_ID" "$RELEASE_REPOSITORY"

      - name: Generate and upload the changelog
        if: inputs.generate_changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash .stroggforge/scripts/shared/changelog.sh CHANGELOG.md
          gh release upload "$RELEASE_NAME" CHANGELOG.md --clobber --repo "$REPOSITORY"

      - name: Open an issue in each dependent repository
        if: github.ref_type == 'tag' && inputs.dependent_repo_names != '' && inputs.dependent_repo_names != '[]'
        env:
          GH_TOKEN: ${{ secrets.DW_BOT_PAT }}
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
          DEPENDENT_REPO_NAMES: ${{ inputs.dependent_repo_names }}
        run: bash .stroggforge/scripts/shared/create-dependent-update-issues.sh "$DEPENDENT_REPO_NAMES" ''

  # On tags, after every test passed: each named crate, or every publishable workspace member in
  # dependency order. Rerunning is safe: versions already on crates.io are skipped.
  crates:
    name: Publish to crates.io
    needs: [lint, test]
    if: inputs.cargo_publish && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: stroggforge-crates-io-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v52
          path: .stroggforge

      - uses: DreamWeave-MP/StroggForge/.github/actions/rust-setup@v52
        with:
          cache: crates

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE_NAMES: ${{ inputs.crate_names }}
          PUBLISH_WORKSPACE: ${{ inputs.cargo_publish_workspace }}
        run: |
          if [ "$PUBLISH_WORKSPACE" = true ]; then
            cp .stroggforge/.github/scripts/publish_workspace.py "$RUNNER_TEMP/publish_workspace.py"
            rm -rf .stroggforge
            python3 "$RUNNER_TEMP/publish_workspace.py"
            exit 0
          fi
          manifests=()
          for crate in $(jq -r '.[]' <<<"$CRATE_NAMES"); do
            manifests+=("$(bash .stroggforge/scripts/shared/resolve-crate-manifest.sh "$crate")")
          done
          rm -rf .stroggforge
          for manifest in "${manifests[@]}"; do
            cargo publish --manifest-path "$manifest"
          done

  # cargo doc, deployed to GitHub Pages from the default branch. A Mod Template site replaces it.
  # Requires Pages with "GitHub Actions" as the source in the repository's settings.
  docs:
    name: Publish the API documentation
    needs: [lint, test]
    if: inputs.publish_docs && !inputs.mod_template && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v52
          path: .stroggforge
      - uses: DreamWeave-MP/StroggForge/.github/actions/rust-setup@v52
        with:
          cache: docs
      - name: Build the documentation
        run: |
          rm -rf target/doc
          cargo doc --no-deps --workspace
          bash .stroggforge/scripts/shared/docs-index.sh '${{ inputs.crate_names }}' target/doc/index.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/doc
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  # Tagged releases only: cargo bench, summarized as BENCHMARKS.md on the release.
  benchmarks:
    name: Benchmark the release
    needs: publish
    if: inputs.generate_benchmarks && github.ref_type == 'tag' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/checkout@v6
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v52
          path: .stroggforge
      - uses: DreamWeave-MP/StroggForge/.github/actions/rust-setup@v52
        with:
          cache: benchmarks
      - name: Run the benchmarks and upload BENCHMARKS.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ needs.publish.outputs.release_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf target/criterion benchmark-output.txt BENCHMARKS.md
          bash .stroggforge/scripts/shared/generate-benchmark-docs.sh .stroggforge/.github/scripts/gen_benchmarks.py
          gh release upload "$RELEASE_NAME" BENCHMARKS.md --clobber --repo "$REPOSITORY"

  # The DreamWeave Mod Template stage: record the versions crates.io has in mod.lock, then build
  # and deploy the site. On a tag it waits for the crates.io publish, so the version is there.
  mod-template:
    needs: [publish, crates]
    if: always() && !cancelled() && inputs.mod_template && github.event_name != 'pull_request' && needs.publish.result == 'success' && (github.ref_type != 'tag' || !inputs.cargo_publish || needs.crates.result == 'success')
    permissions:
      actions: write
      contents: write
      id-token: write
      pages: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/modGlobalBuild.yml@v52
    secrets: inherit
    with:
      rust_release: true

  # A pull request has nothing to record, so it checks and builds the site from the start.
  site-check:
    if: inputs.mod_template && github.event_name == 'pull_request'
    permissions:
      actions: write
      contents: write
      id-token: write
      pages: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/modGlobalBuild.yml@v52
    with:
      rust_release: true

  # One notification per run, after everything has finished, so it can report any failure.
  # Superseded (cancelled) runs stay quiet; the run that replaced them reports instead.
  notify:
    needs: [lint, test, publish, crates, docs, benchmarks, mod-template]
    if: always() && !cancelled() && inputs.generate_discord_notification && github.event_name == 'push'
    uses: DreamWeave-MP/StroggForge/.github/workflows/discord.yml@v52
    secrets:
      WEBHOOK_URL: ${{ secrets.DISCORD_CHANNEL_WEBHOOK || secrets.DW_TOOLS_CHANNEL_WEBHOOK }}
    with:
      title: ${{ contains(needs.*.result, 'failure') && format('{0} pipeline failed! 😭', github.event.repository.name) || '' }}
      description: ${{ contains(needs.*.result, 'failure') && format('[Workflow Results](https://github.com/{0}/actions/runs/{1})', github.repository, github.run_id) || format('[{0}](https://github.com/{1}/releases/tag/{0}) is now available on {2}.', github.ref_type == 'tag' && github.ref_name || 'development', github.repository, (github.ref_type == 'tag' && needs.crates.result == 'success') && 'GitHub and crates.io' || 'GitHub') }}
