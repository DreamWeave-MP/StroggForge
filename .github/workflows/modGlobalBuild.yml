name: Mod Template

# The DreamWeave Mod Template pipeline: validate a site's projects, record and publish their
# releases in the protocol manifest, and build and deploy the site. It runs the template's own
# command targets through jess: `org.dreamweave.mod-template`, which the site's jess.lock pins
# together with the theme and the generator, and `jess workspace sync --locked` restores from the
# packages' publisher before anything runs. There is no Zola and no Python here: a site's CI and a
# maintainer's `jess workspace run` do the same thing with the same bytes.
#
# Mod repositories call it directly. rustGlobalBuild and libGlobalBuild call it with rust_release
# when their caller sets mod_template: they build and publish the Rust release, and this records it.
#
# Pull requests and other branches, one job: validate, test, build the site. Nothing is published.
# The default branch: the same job also records what crates.io and GitHub have published, signs
# and publishes the development release (mods only; a Rust workflow publishes its own), and hands
# the site to a deploy job. Release tags, one job: validate, build the tagged release (a mod's
# archive, or the archives the Rust workflow staged), record it in mod.lock on the default branch,
# publish it (mods only), and start a default-branch run of the calling workflow so the site lists
# it. A mod with Nexus Mods uploads gets one more job per file, and so does each platform of an
# application whose file group NEXUS_GROUP_IDS names.

on:
  workflow_call:
    inputs:
      rust_release:
        type: boolean
        required: false
        default: false
        description: "The calling StroggForge workflow built and published this run's release. Record it without publishing anything, and leave GitHub releases alone."
      rust_archives:
        type: boolean
        required: false
        default: false
        description: "The calling workflow staged program archives as github-release-* artifacts in this run. Record them."
      jess_application:
        type: string
        required: false
        default: ""
        description: "The name a jpk project's mod.toml gives its application ([package] application), when it has one. A tag packs the repository's jess workspace into dist/application with the jess image first: <name>.jsw and an executable per platform jess is released for, which the template records."
    secrets:
      NEXUS_API_KEY:
        required: false
      # A Jess application's file groups, one per platform, as the Rust workflow's: a JSON object
      # keyed like windows-x64-stable. A mod's single file group is its mod.toml's.
      NEXUS_GROUP_IDS:
        required: false

permissions:
  contents: read

env:
  # The jess release every site builds with. Moving it moves every site at once.
  JESS_VERSION: 'v0.2.1'
  # The jess image an application is packed with: every platform's jess as a runtime. Pinned by
  # digest; it moves with JESS_VERSION.
  JESS_IMAGE: 'ghcr.io/dreamweave-mp/jess@sha256:1cd24f4fe5718a0b2549bcfebf55a803d7377073e1a54336d484a40c7e70c05e'
  # Where a site without a jess.lock takes the template and everything it depends on from, at the
  # version its jess-workspace.toml asks for; the lock CI then commits names each package's publisher.
  DREAMWEAVE_PUBLISHERS: >-
    https://dreamweave-mp.github.io/DreamWeave-Mod-Template/
    https://dreamweave-mp.github.io/dreamweave-site/
    https://dreamweave-mp.github.io/dreamweave-theme/
    https://dreamweave-mp.github.io/magick/
    https://dreamweave-mp.github.io/vfstool/
    https://dreamweave-mp.github.io/dream_archive/
  # Set as a repository variable on a DreamWeave package site only while the sites above are being
  # brought up for the first time: `owner/repo@ref` git sources to sync offline from, in place of
  # the publishers that don't exist yet. See scripts/mod-template/sync-pins.sh.
  DREAMWEAVE_BOOTSTRAP_SOURCES: ${{ vars.DREAMWEAVE_BOOTSTRAP_SOURCES }}
  # Keyless signatures made in a reusable workflow name it as the signer, so the manifest does too.
  DREAMWEAVE_SIGNING_IDENTITY: https://github.com/DreamWeave-MP/StroggForge/.github/workflows/modGlobalBuild.yml@refs/tags/v67

jobs:
  site:
    name: Validate, test and build the site
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the development release, and releases recorded on the default branch
      pages: read
      id-token: write # Sigstore
    env:
      PUBLISHING: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v67
          path: .stroggforge

      - uses: DreamWeave-MP/StroggForge/.github/actions/jess-setup@v67
        with:
          jess-version: ${{ env.JESS_VERSION }}

      # A copy of the template is a site, not the tool: on its first push to the default branch,
      # the tool's source and the template's own page go, jess-workspace.toml names the template
      # as the site's tool, and the result is committed. Never in the template's repository, never
      # in a fork of it, and never touching a file the developer changed since the copy was made.
      - name: Make a copy of the template a site
        if: env.PUBLISHING == 'true' && github.repository != 'DreamWeave-MP/DreamWeave-Mod-Template' && !github.event.repository.fork
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .stroggforge/scripts/mod-template/scaffold.sh "$DEFAULT_BRANCH"

      # The template, the theme and the generator, exactly as jess.lock pins them, from their
      # publisher: nothing is built from a checkout of either. A site without a lock yet gets one
      # here, from the template's publisher, committed to the default branch on its first push.
      - name: Restore the template packages the site pins
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .stroggforge/scripts/mod-template/sync-pins.sh "$DEFAULT_BRANCH" "$PUBLISHING"

      - name: Validate every project
        run: jess workspace run --trusted dreamweave-check

      # crates.io and GitHub never change a published release, so any run on the default branch
      # may record what they have: a tag's crate, or releases from before the repository was a site.
      - name: Record releases published to crates.io and GitHub
        if: env.PUBLISHING == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .stroggforge/scripts/mod-template/commit-records.sh "$DEFAULT_BRANCH"

      - name: Find the published site's URL
        id: pages
        if: env.PUBLISHING == 'true'
        uses: actions/configure-pages@v6

      - name: Choose the base URL
        id: base
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -n "$PAGES_URL" ]; then
            echo "url=$PAGES_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=$(sed -n 's/^base_url *= *"\(.*\)"/\1/p' config.toml | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the archives the Rust workflow published
        if: inputs.rust_archives && github.event_name != 'pull_request'
        uses: actions/download-artifact@v8
        with:
          pattern: github-release-*
          path: dist/binaries/
          merge-multiple: true

      - name: Package development builds, build the site, and check it
        env:
          DREAMWEAVE_BASE_URL: ${{ steps.base.outputs.url }}
          DREAMWEAVE_DEVELOPMENT_REF: refs/heads/${{ github.event.repository.default_branch }}
          BASE_URL: ${{ steps.base.outputs.url }}
        run: |
          jess workspace run --trusted dreamweave-build -- "$BASE_URL"
          jess workspace run --trusted dreamweave-site -- public "$BASE_URL"
          jess workspace run --trusted dreamweave-links -- public "$BASE_URL"

      - name: Check whether anything asks to be signed
        id: signing
        env:
          MOD_RELEASE: ${{ !inputs.rust_release }}
        run: |
          if [ -s dist/sign.txt ] && [ "$PUBLISHING" = true ] && [ "$MOD_RELEASE" = true ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@v3
        if: steps.signing.outputs.needed == 'true'

      - name: Sign development archives with Sigstore (keyless)
        if: steps.signing.outputs.needed == 'true'
        working-directory: dist
        run: |
          while IFS= read -r archive; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done < sign.txt

      # The development release follows the default branch: replaced on every build, and its tag
      # moved. dist/github-release names it (`development`, or `dev-build` in the template's own
      # repository). Created as a draft and published once its files are attached.
      - name: Publish the development release
        if: env.PUBLISHING == 'true' && !inputs.rust_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          release=$(cat dist/github-release)
          shopt -s nullglob
          files=(dist/*.zip dist/*.jpk dist/*.jsw dist/*.sigstore.json)
          if gh release view "$release" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$release" --yes --repo "$REPOSITORY"
          fi
          gh api -X DELETE "repos/$REPOSITORY/git/refs/tags/$release" >/dev/null 2>&1 || true
          if [ ${#files[@]} -eq 0 ]; then
            echo "No project publishes a development build."
            exit 0
          fi
          gh release create "$release" --prerelease --draft --target "$GITHUB_SHA" --title "Development build" \
            --notes "The default branch at $GITHUB_SHA, built by $RUN_URL. It may be ahead of the last release, and it may be broken." \
            --repo "$REPOSITORY"
          gh release upload "$release" "${files[@]}" --repo "$REPOSITORY"
          gh release edit "$release" --draft=false --repo "$REPOSITORY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: env.PUBLISHING == 'true'
        with:
          path: public/

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Build, record and publish the tagged release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: write # the default-branch run that lists the release
      contents: write # the mod.lock commit on the default branch, and the release
      id-token: write # Sigstore
    outputs:
      nexus: ${{ steps.nexus.outputs.uploads || '[]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: DreamWeave-MP/StroggForge
          ref: v67
          path: .stroggforge

      - uses: DreamWeave-MP/StroggForge/.github/actions/jess-setup@v67
        with:
          jess-version: ${{ env.JESS_VERSION }}

      - name: Restore the template packages the site pins
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .stroggforge/scripts/mod-template/sync-pins.sh "$DEFAULT_BRANCH" false

      - name: Validate every project
        run: jess workspace run --trusted dreamweave-check

      - name: Collect the archives the Rust workflow published
        if: inputs.rust_archives
        uses: actions/download-artifact@v8
        with:
          pattern: github-release-*
          path: dist/binaries/
          merge-multiple: true

      # A Jess application is packed here, the way a program is built by the Rust workflow: the
      # jess image packs the repository's workspace into dist/application, the .jsw and an
      # executable for every platform it holds a runtime for, and the release records them. It
      # runs as the runner's user, so what it writes belongs to the steps after it.
      - name: Pack the Jess application
        if: inputs.jess_application != ''
        env:
          APPLICATION: ${{ inputs.jess_application }}
        run: |
          if [[ ! "$APPLICATION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::jess_application '$APPLICATION' must be a file name: letters, digits, '.', '_' and '-'"
            exit 1
          fi
          mkdir -p dist/application
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work "$JESS_IMAGE" \
            workspace pack --output "dist/application/$APPLICATION.jsw" --runtimes /opt/jess/runtimes

      - name: Build the release from the tag
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          jess workspace run --trusted dreamweave-release -- "$TAG"
          if [ -f dist/release.json ]; then echo "recorded=true" >> "$GITHUB_OUTPUT"; else echo "recorded=false" >> "$GITHUB_OUTPUT"; fi

      # A Rust workflow signs its own binaries; Sigstore bundles here are for mod archives.
      - name: Check whether anything asks to be signed
        id: signing
        if: steps.build.outputs.recorded == 'true' && !inputs.rust_release
        run: |
          if [ -s dist/sign.txt ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; else echo "needed=false" >> "$GITHUB_OUTPUT"; fi

      - uses: sigstore/cosign-installer@v3
        if: steps.signing.outputs.needed == 'true'

      - name: Sign archives with Sigstore (keyless)
        if: steps.signing.outputs.needed == 'true'
        working-directory: dist
        run: |
          while IFS= read -r archive; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done < sign.txt

      # A release already recorded must match its record, so re-running this job is harmless and a
      # moved tag cannot replace a published archive. A crate's tag records nothing here, but the
      # version it published is on crates.io by now, and record-crates records it.
      - name: Record the release in mod.lock on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .stroggforge/scripts/mod-template/commit-records.sh "$DEFAULT_BRANCH"

      # A mod's release is this workflow's to publish, created once as a draft and published when
      # its files are attached. A re-run's archives match the record, so replacing them changes
      # nothing. Immutable releases work for tags.
      - name: Publish the GitHub release
        if: steps.build.outputs.recorded == 'true' && !inputs.rust_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release=$(cat dist/github-release)
          shopt -s nullglob
          files=(dist/*.zip dist/*.jpk dist/*.jsw dist/*.sigstore.json)
          if gh release view "$release" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release" "${files[@]}" --clobber --repo "$REPOSITORY"
            gh release edit "$release" --notes-file dist/release-notes.md --repo "$REPOSITORY"
          else
            title=$(jq -r '"\(.name) \(.release.version)"' dist/release.json)
            gh release create "$release" --verify-tag --draft --title "$title" --notes-file dist/release-notes.md --repo "$REPOSITORY"
            gh release upload "$release" "${files[@]}" --repo "$REPOSITORY"
            gh release edit "$release" --draft=false --repo "$REPOSITORY"
          fi

      # A mod's uploads are the template's; an application's are each platform's zip, to the file
      # group NEXUS_GROUP_IDS names for it, as the Rust workflow uploads a program's.
      - name: Read the Nexus Mods uploads
        id: nexus
        if: steps.build.outputs.recorded == 'true' && !inputs.rust_release
        env:
          APPLICATION: ${{ inputs.jess_application }}
          NEXUS_GROUP_IDS: ${{ secrets.NEXUS_GROUP_IDS }}
        run: bash .stroggforge/scripts/mod-template/nexus-uploads.sh

      - uses: actions/upload-artifact@v7
        if: steps.nexus.outputs.uploads != '' && steps.nexus.outputs.uploads != '[]'
        with:
          name: release
          path: |
            dist/
            !dist/binaries/
          if-no-files-found: error

      # GITHUB_TOKEN's pushes start no runs, so the record commit alone would never reach the site.
      # This starts the calling workflow on the default branch, the one that runs this stage there.
      - name: Start a default-branch run, which lists the release on the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          CALLER: ${{ github.workflow_ref }}
        run: |
          # github.workflow_ref names the calling workflow: owner/repo/.github/workflows/<file>@<ref>
          workflow=${CALLER%%@*}
          workflow=${workflow##*/}
          gh workflow run "$workflow" --ref "$DEFAULT_BRANCH" --repo "$REPOSITORY"

  # Nexus Mods takes one file per call of its upload action, so each file is its own job.
  nexus-upload:
    name: Upload to Nexus Mods
    needs: release
    if: needs.release.outputs.nexus != '[]'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        upload: ${{ fromJson(needs.release.outputs.nexus) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/

      - uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ matrix.upload.file_group_id }}
          filename: dist/${{ matrix.upload.filename }}
          version: ${{ matrix.upload.version }}
          display_name: ${{ matrix.upload.name }}
          archive_existing_version: true
          # A mod is a mod manager's primary download; an application's platform zips are not.
          primary_mod_manager_download: ${{ matrix.upload.primary != false }}
          update_mod_version: true
