name: DreamWeave Webhook

on:
  workflow_call:
    secrets:
      WEBHOOK_URL:
        required: false

    inputs:
      webhook_url:
        required: false
        type: string
        default: ""
      avatar_url:
        required: false
        type: string
        default: "https://avatars.githubusercontent.com/u/138459727?s=400&u=827e40e3dd9c110c15b3bff26eec0144841e657d&v=4"
      title:
        required: false
        type: string
        default: ""
      description:
        required: false
        type: string
        default: ""
      footer_text:
        required: false
        type: string
        default: ""

jobs:
  discord-notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - name: Skip Missing Webhook
        if: env.WEBHOOK_URL == ''
        run: echo "Discord webhook secret was not provided; skipping notification."

      # Expressions reach the shell through env, never by splicing into the script text:
      # a title or description containing quotes or $(...) must stay data.
      - name: Detect Release URL
        if: env.WEBHOOK_URL != ''
        id: detect
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "release_time=$(date -u "+%F %T")"
            if [[ "$REF" == refs/tags/* ]]; then
              echo "release_name=$REF_NAME"
              echo "display_name=$REF_NAME"
            else
              echo "release_name=development"
              echo "display_name=${SHA:0:7}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Initialize Empty Fields
        if: env.WEBHOOK_URL != ''
        id: format
        env:
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          FOOTER_TEXT: ${{ inputs.footer_text }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
          DISPLAY_NAME: ${{ steps.detect.outputs.display_name }}
          RELEASE_NAME: ${{ steps.detect.outputs.release_name }}
          RELEASE_TIME: ${{ steps.detect.outputs.release_time }}
        run: |
          {
            if [[ -z "$TITLE" ]]; then
              echo "title=$REPOSITORY_NAME has been updated."
            else
              echo "title=$TITLE"
            fi

            if [[ -z "$DESCRIPTION" ]]; then
              echo "description=[$DISPLAY_NAME](https://github.com/$REPOSITORY/releases/tag/$RELEASE_NAME) is now available on GitHub and the AUR."
            else
              echo "description=$DESCRIPTION"
            fi

            if [[ -z "$FOOTER_TEXT" ]]; then
              echo "footer_text=Workflow: $RUN_ID by: $ACTOR at: $RELEASE_TIME"
            else
              echo "footer_text=$FOOTER_TEXT"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Discord Webhook Action
        if: env.WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v7.0.0
        with:
          username: DreamWeave
          webhook-url: ${{ env.WEBHOOK_URL }}
          avatar-url: ${{ inputs.avatar_url }}
          embed-title: ${{ steps.format.outputs.title }}
          embed-description: ${{ steps.format.outputs.description }}
          embed-footer-text: ${{ steps.format.outputs.footer_text }}
