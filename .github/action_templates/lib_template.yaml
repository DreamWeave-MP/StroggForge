name: Library CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # Keep branch pushes restricted to main. Non-tag pushes publish to the shared
    # "development" release, so feature branches will compete for the same release.
    branches: main
    tags: ['*']

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/libGlobalBuild.yml@v50
    secrets: inherit
    with:
      # Required: JSON array of crate names. Must match [package].name in Cargo.toml.
      # Add more entries for workspaces with multiple publishable crates.
      crate_names: '["ENTER_CRATE_NAME_HERE"]'

      # Optional: uncomment to notify dependent repositories on tagged releases.
      # dependent_repo_names: |
      #   DreamWeave-MP/DW-tools

      # Optional: set false if this project uses its own SSG for docs.
      # publish_docs: false

      # Optional: set true if this repository is a DreamWeave Mod Template site. The Mod Template
      # stage records each version crates.io has in mod.lock and builds and deploys the site in
      # place of rustdoc. Grant `actions: write` in the permissions above as well.
      # mod_template: true

      # Optional: set false if this project does not publish to crates.io.
      # cargo_publish: false

      # Optional: publish every workspace member in dependency order instead of one crate per crate name.
      # cargo_publish_workspace: true

      # Optional: check the workspace on its minimum supported Rust version before release.
      # Use a version such as '1.88', or `auto` to read rust-version from Cargo.toml.
      # msrv: auto

      # Optional: set true if this project has Criterion benchmarks.
      # generate_benchmarks: true

      # Optional: set false if another workflow in the same run already sends the discord notification.
      # generate_discord_notification: false
