reviewed = "2026-09-28"
rust_policy = "The reusable workflows build with stable Rust, which moves. MSRV is a per-consumer input: empty skips the check, auto reads rust-version from Cargo.toml."
llvm_policy = "Every compiling job runs setup-llvm, which installs clang and lld and fails unless they match the LLVM major of the rustc in use. MSRV jobs get the older rustc's LLVM. The rollout is still in progress; see the LLVM campaign."
reference = "rustc 1.98.1 (LLVM 22), clang/lld 22.1.8 and Luau 0.740, measured on Linux for L3i. A reference point, not an organization-wide pin."

[[platforms]]
id = "linux-x64"
name = "Linux x86_64"
target = "x86_64-unknown-linux-gnu"
workflow = "rustGlobalBuild"
job = "release-linux"
baseline = "CentOS Stream 9 / EL9; glibc 2.34"
compiler = "Stream clang/lld must match rustc LLVM major"
validation = "unknown"
notes = "The floor is deliberate: RHEL/AlmaLinux 9, Ubuntu 22.04, Debian 12 and newer. CentOS Stream and stable Rust move independently, so when their LLVM majors drift apart the build fails loudly on purpose."

[[platforms]]
id = "portmaster-arm64"
name = "PortMaster ARM64 (opt-in)"
target = "aarch64-unknown-linux-gnu"
workflow = "rustGlobalBuild"
job = "release-portmaster"
baseline = "EL9 aarch64 sysroot; glibc 2.34"
compiler = "clang/lld + cross-language thin LTO"
validation = "blocked"
notes = "Opt in with enable_portmaster. Builds now target glibc 2.34; the EL8 floor of 2.28 is gone. Nobody has run the new artifact on a device yet, so which handhelds it supports is an open question."

[[platforms]]
id = "android-arm64"
name = "Android ARM64 (opt-in)"
target = "aarch64-linux-android"
workflow = "rustGlobalBuild"
job = "release-android"
baseline = "NDK r27c / Android API 23"
compiler = "NDK target clang; host LLVM setup also runs"
validation = "unknown"
notes = "Opt in with enable_android. You get a native ELF, not an APK. Matching the host's LLVM says nothing about whether NDK bitcode links with l3i's."

[[platforms]]
id = "macos-arm64"
name = "macOS ARM64"
target = "aarch64-apple-darwin"
workflow = "rustGlobalBuild"
job = "release"
baseline = "macos-latest hosted runner"
compiler = "LLVM's official macOS ARM64 release, clang and lld matched to rustc"
validation = "unknown"
notes = "Upstream LLVM from LLVM's own release archive, never Apple clang, whose version numbers are not LLVM's. Intentional difference: Apple consumers link with clang and lld but leave out -Clinker-plugin-lto, because rustc passes it GNU -plugin-opt arguments that ld64.lld rejects. The deployment floor follows the hosted runner image."

[[platforms]]
id = "macos-x64"
name = "macOS x86_64"
target = "x86_64-apple-darwin"
workflow = "rustGlobalBuild"
job = "release"
baseline = "macos-15-intel hosted runner"
compiler = "conda-forge clang / lld matched to rustc"
validation = "unknown"
notes = "Built on its own Intel runner rather than trusting the ARM binary under Rosetta. LLVM publishes no Intel macOS build and Homebrew no longer bottles current LLVM for Intel, so the toolchain comes from conda-forge through a standalone micromamba. Same linker-plugin-lto exception as ARM64."

[[platforms]]
id = "windows-x64"
name = "Windows x86_64"
target = "x86_64-pc-windows-msvc"
workflow = "rustGlobalBuild"
job = "release"
baseline = "windows-2025-vs2026 hosted runner"
compiler = "Upstream LLVM; clang-cl / lld-link for MSVC"
validation = "unknown"
notes = "LLVM comes from the upstream release archive, and C++ builds with clang-cl and links with lld-link. Intentional difference: setup-llvm pins CARGO_BUILD_TARGET to the host triple, so target rustflags stop reaching proc macros, which rustc refuses to build with -Clinker-plugin-lto on MSVC. The side effect is that output lands in target/<triple>/release."
