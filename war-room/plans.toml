# Planning intent, not inferred CI health. No invented version/date commitments.
[[plans]]
id = "llvm-rollout"
kind = "campaign"
name = "LLVM / Luau / L3i alignment"
projects = ["stroggforge", "l3i", "dream-ini", "soft-render"]
state = "blocked"
reviewed = "2026-09-28"
depends_on = []
platforms = ["linux-x64", "portmaster-arm64", "android-arm64", "macos-arm64", "macos-x64", "windows-x64"]
distribution = ["github-releases", "crates-io"]
notes = "Move every compiling DreamWeave build onto clang and lld matching rustc's LLVM, so L3i's cross-language LTO works everywhere it ships. The reference setup is rustc 1.98.1 with LLVM/clang/lld 22.1.8. StroggForge matches the LLVM major of whatever rustc a job uses rather than pinning that exact patch release. Blocked means nobody has signed off on the rollout yet, not that every build is failing."
links = ["https://github.com/DreamWeave-MP/StroggForge/actions"]

[[plans.requirements]]
id = "portable-config"
kind = "task"
label = "Replace PortMaster GCC/EL8 configuration with clang/lld and an EL9 sysroot"
state = "done"
detail = "Done in the workflows: the PortMaster job cross-compiles with clang/lld and cross-language LTO against an EL9 sysroot, glibc 2.34. Whether the result runs on a device is the next requirement."
evidence = [".github/workflows/rustGlobalBuild.yml:release-portmaster", "Git commit e83a91c"]

[[plans.requirements]]
id = "portable-proof"
kind = "artifact"
label = "Prove the portable artifact on the intended device/runtime"
state = "blocked"
detail = "Nobody has run an LLVM-built PortMaster binary on a handheld yet. Link the Actions run, the readelf output and the device test when somebody does."
evidence = []

[[plans.requirements]]
id = "consumer-rollout"
kind = "ci"
label = "Audit and migrate every affected consumer's ref and Cargo compiler flags"
state = "active"
detail = "Consumers pin anything from v40 to v48, so most have not received the LLVM changes. Cargo does not inherit a dependency's .cargo/config.toml: every l3i consumer carries its own clang, lld and linker-plugin-lto settings, and all three have to be right."
evidence = []

[[plans.requirements]]
id = "android-llvm"
kind = "platform"
label = "Resolve Android NDK versus rustc LLVM compatibility"
state = "todo"
detail = "The Android job uses NDK r27c at API 23, while setup-llvm matches the host rustc's LLVM. Nobody knows yet whether those two produce bitcode that links together. Measure it before claiming Android works."
evidence = []

[[plans.requirements]]
id = "migration-docs"
kind = "documentation"
label = "Record compatibility floor and migration results"
state = "active"
detail = "Write down the new floor (EL9, glibc 2.34), what the EL8 retirement broke, how MSRV jobs pick their LLVM, and which devices were actually tested."
evidence = []

