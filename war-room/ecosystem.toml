# Canonical DreamWeave inventory: reviewed human intent. Facts about StroggForge itself
# (workflow inputs, jobs, runners) are read from this checkout, not recorded here.
schema = 1
reviewed = "2026-09-28"
scope = "Every current DreamWeave component that gets engineered, by domain. This is not a dump of every repository in the organization, and a lifecycle is a maintainer's call, not a guess from the last commit date."

# Infrastructure changes that alter what consumers get. Git holds the full history.
[[updates]]
date = "2026-09-29"
title = "Self-referential pins move to v51"
detail = "Templates and internal workflow/action calls reference v51. A consumer pinned to an older tag keeps that tag's behavior, including its toolchain and builder images."
commits = ["391c9b8"]

[[updates]]
date = "2026-09-29"
title = "A program's library is recorded in the same run"
detail = "rustGlobalBuild's Mod Template stage waits for the crates.io publish. A repository that publishes its program and the library it is built on together, like vfstool, records the library's version in the same run as the program's archives."
commits = ["0ce68a3"]

[[updates]]
date = "2026-09-29"
title = "Self-referential pins move to v50"
detail = "Templates and internal workflow/action calls reference v50. A consumer pinned to an older tag keeps that tag's behavior, including its toolchain and builder images."
commits = ["0211319"]

[[updates]]
date = "2026-09-29"
title = "Mod Template sites build before their first release"
detail = "modGlobalBuild's record step failed on every default-branch run of a site with no mod.lock yet, because it staged locks by a pattern that matched nothing. Sites calling v49 must move to v50."
commits = ["012d31a"]

[[updates]]
date = "2026-09-28"
title = "Self-referential pins move to v49"
detail = "Templates and internal workflow/action calls reference v49. A consumer pinned to an older tag keeps that tag's behavior, including its toolchain and builder images."
commits = ["9f494e3"]

[[updates]]
date = "2026-09-28"
title = "The Mod Template pipeline moves into StroggForge"
detail = "modGlobalBuild runs DreamWeave Mod Template sites. rustGlobalBuild and libGlobalBuild gain mod_template, which records a published Rust release in the site's protocol manifest and deploys the site in place of rustdoc, and rustGlobalBuild gains muxapp_dir, which publishes the PortMaster build as a muOS app."
commits = ["f5acf9f", "2e5de82"]

[[updates]]
date = "2026-09-28"
title = "Self-referential pins move to v48"
detail = "Templates and internal workflow/action calls reference v48. A consumer pinned to an older tag keeps that tag's behavior, including its toolchain and builder images."
commits = ["c2bf587"]

[[updates]]
date = "2026-09-28"
title = "Windows builds pin an explicit Cargo target"
detail = "setup-llvm sets CARGO_BUILD_TARGET to the host triple on Windows, so target rustflags such as -Clinker-plugin-lto no longer reach MSVC proc macros and build scripts. Release binaries now land under target/<triple>/release, where Corprus Crucible looks for them."
commits = ["83eba44"]
plan = "llvm-rollout"

[[updates]]
date = "2026-09-28"
title = "PortMaster builds use clang/lld against an EL9 sysroot"
detail = "The AlmaLinux 8 GCC cross builder is retired and the portable glibc floor rises from 2.28 to 2.34. Configuration landed; device validation remains a campaign requirement."
commits = ["e83a91c"]
plan = "llvm-rollout"

[[updates]]
date = "2026-09-28"
title = "Matching LLVM is mandatory; the llvm_toolchain input is gone"
detail = "Every compiling job runs setup-llvm and fails unless clang and lld share rustc's LLVM major. Callers still passing llvm_toolchain must drop that input when they move their pin."
commits = ["681d74d", "539ee3c"]
plan = "llvm-rollout"

[[updates]]
date = "2026-09-28"
title = "Linux releases build on CentOS Stream 9"
detail = "The AlmaLinux 8 builder is retired because no LLVM 22 exists for EL8. The stream's clang/lld build binaries with a glibc 2.34 floor: RHEL/AlmaLinux 9, Ubuntu 22.04, Debian 12 and newer."
commits = ["1981ef9"]
plan = "llvm-rollout"

[[updates]]
date = "2026-09-27"
title = "Consumer submodules are checked out in every job"
detail = "Quality, release and documentation jobs fetch the consuming repository's submodules."
commits = ["b579e41"]

[[updates]]
date = "2026-09-26"
title = "Workspace publishing, MSRV checks and package-selected binaries"
detail = "cargo_publish_workspace publishes in dependency order; the msrv job checks a declared or explicit MSRV; binary_package builds a binary from any workspace package; Discord receives one aggregated notification."
commits = ["a2fd779"]

