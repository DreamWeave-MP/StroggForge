base_url = "https://dreamweave-mp.github.io/StroggForge"
title = "DreamWeave War Room"
description = "StroggForge: DreamWeave's engineering inventory, release room and Rust supply line."
compile_sass = true
build_search_index = true
generate_feeds = false

[search]
index_format = "fuse_json"
include_description = true
include_content = true

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"

[link_checker]
skip_prefixes = ["https://github.com/", "https://docs.rs/"]
